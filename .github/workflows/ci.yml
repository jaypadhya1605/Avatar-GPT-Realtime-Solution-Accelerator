name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Azure Bicep CLI
        run: az bicep install

      - name: Bootstrap locked dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Run tests, scans, and Bicep validation
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Build and smoke-test deployment package
        shell: pwsh
        run: ./scripts/package.ps1